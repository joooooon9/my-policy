name: my-policy

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: my_policy
      POSTGRES_USER: ${DB_USER:-my_policy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-my_policy_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
