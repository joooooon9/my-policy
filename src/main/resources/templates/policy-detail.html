<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${policy.title()}"></title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="icon" href="/img/about-mark.svg" type="image/svg+xml">
    <meta name="theme-color" content="#ffffff">
    <script th:src="@{/js/theme.js}" src="/js/theme.js"></script>
    <link rel="stylesheet" th:href="@{/css/policy.css}">
</head>
<body>
<header class="site-header"><div class="wrap"><a class="logo" th:href="@{/}"><img th:src="@{/img/about-mark.svg}" alt="">나의 정책 찾기</a><div class="header-actions"><a class="nav-link" th:href="@{/about}">서비스 소개</a><button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="다크 모드"><svg class="i-moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 12.4A7 7 0 0 1 7.6 3.5a7 7 0 1 0 8.9 8.9Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><svg class="i-sun" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M4.3 15.7l1.4-1.4M14.3 5.7l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></div></div></header>
<main class="wrap">
    <a class="back" th:href="@{/}">← 공고 목록</a>
    <div class="detail-layout">
    <article class="detail">
        <span class="region" th:attr="data-region=${policy.region().name()}" th:text="${policy.region().label()}"></span>
        <h1 th:text="${policy.title()}"></h1>
        <div class="benefit" th:if="${policy.benefit() != null}"><span>지원 혜택</span><strong th:text="${policy.benefit()}"></strong></div>
        <dl>
            <dt>지원 대상</dt>
            <dd th:each="line : ${policy.target()}" th:text="${line}"></dd>
            <dt>지원 내용</dt>
            <dd th:text="${policy.summary()}"></dd>
            <dt>신청 기간</dt>
            <dd th:text="${policy.period()}"></dd>
            <dd class="deadline-line" th:if="${policy.open()}" th:text="${policy.deadline()}"></dd>
            <dd class="deadline-line" th:unless="${policy.open()}">신청이 끝났거나 아직 시작하지 않았어요.</dd>
        </dl>
        <div class="checks" th:if="${!policy.checkNotes().isEmpty()}">
            <strong>추가 확인이 필요한 조건</strong>
            <div><small th:each="note : ${policy.checkNotes()}" th:text="${note}"></small></div>
        </div>
    </article>
    <aside class="detail actions">
        <strong>신청 안내</strong>
        <th:block th:if="${policy.applyUrl() != null}">
            <a class="btn" th:href="${policy.applyUrl()}" target="_blank" rel="noopener noreferrer">공식 신청 페이지로 이동</a>
        </th:block>
        <th:block th:if="${policy.applyUrl() == null and policy.officialUrl() != null}">
            <a class="btn" th:href="${policy.officialUrl()}" target="_blank" rel="noopener noreferrer">공식 공고 보기</a>
        </th:block>
        <p th:if="${policy.applyUrl() == null and policy.officialUrl() == null}">화면 확인용 샘플 공고예요. 공식 공고를 연동하면 신청 페이지 링크가 여기에 표시돼요.</p>
        <p class="checked" th:if="${policy.lastChecked() != null}" th:text="|마지막 확인 ${policy.lastChecked()}|"></p>
    </aside>
    </div>
</main>
</body>
</html>
