<!doctype html>
<!-- Shared header and footer for the search and detail screens, built to match /about (the kit's nav and footer). -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<header class="site-header" th:fragment="header(current)">
    <div class="wrap site-header__bar">
        <a class="logo" th:href="@{/}"><span class="mark" aria-hidden="true"></span>나의 정책 찾기</a>
        <nav class="site-nav" aria-label="주요 메뉴">
            <a class="nav-link nav-link--search" th:href="@{/}" th:attr="aria-current=${current == 'search' ? 'page' : null}">공고 찾기</a>
            <a class="nav-link" th:href="@{/about}">서비스 소개</a>
        </nav>
        <div class="header-actions">
            <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="다크 모드"><svg class="i-moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 12.4A7 7 0 0 1 7.6 3.5a7 7 0 1 0 8.9 8.9Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><svg class="i-sun" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M4.3 15.7l1.4-1.4M14.3 5.7l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
        </div>
    </div>
</header>

<footer class="site-footer" th:fragment="footer">
    <div class="wrap">
        <div class="site-footer__top">
            <a class="logo" th:href="@{/}"><span class="mark" aria-hidden="true"></span>나의 정책 찾기</a>
            <p>청년과 직장인을 위한 지원 정책 검색</p>
        </div>
        <div class="site-footer__legal">
            <span>&copy; 2026 나의 정책 찾기</span>
            <span>정책 정보 출처: <a href="https://www.youthcenter.go.kr" target="_blank" rel="noopener noreferrer">온통청년</a>(한국고용정보원)</span>
        </div>
    </div>
</footer>

</body>
</html>
