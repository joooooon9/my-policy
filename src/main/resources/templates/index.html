<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>나의 정책 찾기</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="icon" href="/img/about-mark.svg" type="image/svg+xml">
    <meta name="theme-color" content="#ffffff">
    <script th:src="@{/js/theme.js}" src="/js/theme.js"></script>
    <link rel="stylesheet" th:href="@{/css/policy.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header('search')}"></header>
<main class="wrap">
    <section class="search">
        <h1>내 조건에 맞는 정책 찾기</h1>
        <p class="search-lead">거주 지역, 나이, 재직 상태를 넣으면 신청할 수 있는 공고만 추려 보여줘요.</p>
        <form method="get" th:action="@{/}">
            <label>거주 지역
                <select name="region">
                    <option value="">전체 지역</option>
                    <option th:each="r : ${regions}" th:value="${r.param()}" th:selected="${region == r.param()}" th:text="${r.label()}"></option>
                </select>
            </label>
            <label>만 나이<input name="age" type="number" min="0" max="130" placeholder="예: 28" th:value="${age}"></label>
            <label>재직 상태
                <select name="employment" id="employment">
                    <option value="">전체</option>
                    <option value="employed" th:selected="${employment == 'employed'}">재직 중</option>
                    <option value="unemployed" th:selected="${employment == 'unemployed'}">미재직</option>
                </select>
            </label>
            <label id="company" th:hidden="${employment != 'employed'}">중소기업 재직 여부
                <select name="smallBusiness" th:disabled="${employment != 'employed'}">
                    <option value="">잘 모르겠어요</option>
                    <option value="yes" th:selected="${smallBusiness == 'yes'}">예</option>
                    <option value="no" th:selected="${smallBusiness == 'no'}">아니요</option>
                </select>
            </label>
            <button type="submit">내 조건으로 찾기</button>
        </form>
    </section>
    <section class="results">
        <div class="results-heading">
            <h2 th:text="${searched ? '맞춤 검색 결과' : '신청 가능한 공고'}"></h2>
            <a th:if="${searched}" th:href="@{/}">검색 초기화</a>
        </div>
        <p class="muted">온통청년 공식 공고를 1시간마다 확인해요. 신청 전에 공식 공고를 꼭 확인해 주세요.</p>
        <p class="empty" th:if="${policies.isEmpty()}">조건에 맞는 공고가 없어요.</p>
        <ul class="cards">
            <li th:each="policy : ${policies}">
                <a class="card" th:href="@{/policies/{id}(id=${policy.id()})}">
                    <span class="region" th:attr="data-region=${policy.region().name()}"><span th:text="${policy.region().label()}"></span><span class="inst" th:if="${policy.institution() != null}" th:text="|· ${policy.institution()}|"></span></span>
                    <h3 th:text="${policy.title()}"></h3>
                    <p class="summary" th:if="${policy.summary() != null and !policy.summary().isEmpty()}" th:text="${policy.summary()}"></p>
                    <div class="benefit" th:if="${policy.benefit() != null}"><span>지원 혜택</span><strong th:text="${policy.benefit()}"></strong></div>
                    <div class="deadline" th:text="${policy.deadline()}"></div>
                    <small th:each="note : ${policy.checkNotes()}" th:text="${note}"></small>
                </a>
            </li>
        </ul>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script>
    const employment = document.querySelector('#employment');
    const company = document.querySelector('#company');
    employment.addEventListener('change', () => {
        company.hidden = employment.value !== 'employed';
        company.querySelector('select').disabled = company.hidden;
    });
</script>
</body>
</html>
