spring.application.name=my-policy
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/my_policy}
spring.datasource.username=${DB_USER:my_policy}
spring.datasource.password=${DB_PASSWORD:my_policy_local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
my-policy.zone=Asia/Seoul
my-policy.sample-data=false
my-policy.collect.enabled=true
my-policy.collect.cron=0 0 * * * *
# local secrets: KEY=value lines in .env at the project root (git-ignored); OS environment variables win
spring.config.import=optional:file:.env[.properties]
my-policy.youthcenter.api-key=${YOUTHCENTER_API_KEY:}
# service regions collected from 온통청년 so far: NATIONWIDE, then JEONBUK, IKSAN (CLAUDE.md rollout)
my-policy.youthcenter.regions=NATIONWIDE
