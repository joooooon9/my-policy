spring.application.name=my-policy
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/my_policy}
spring.datasource.username=${DB_USER:my_policy}
spring.datasource.password=${DB_PASSWORD:my_policy_local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
my-policy.zone=Asia/Seoul
my-policy.sample-data=true
my-policy.collect.enabled=true
my-policy.collect.cron=0 0 * * * *
